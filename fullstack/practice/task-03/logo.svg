<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gradFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    
    <linearGradient id="gradBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA709A" />
      <stop offset="100%" stop-color="#FEE140" />
    </linearGradient>
    
    <style>
      .text-main { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #FFFFFF; letter-spacing: 2px; }
      .text-sub { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 22px; fill: #A0AEC0; letter-spacing: 6px; }
    </style>
  </defs>

  <rect width="400" height="400" rx="40" fill="#0F172A" />

  <g transform="translate(50, 100)">
    <path d="M 50 20 L 10 60 L 50 100" fill="none" stroke="url(#gradFront)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 90 20 L 130 60 L 90 100" fill="none" stroke="url(#gradFront)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 85 10 L 55 110" fill="none" stroke="url(#gradFront)" stroke-width="12" stroke-linecap="round" />
  </g>

  <g transform="translate(220, 100)">
     <ellipse cx="60" cy="25" rx="45" ry="15" fill="none" stroke="url(#gradBack)" stroke-width="12" />
     <path d="M 15 25 L 15 65 A 45 15 0 0 0 105 65 L 105 25" fill="none" stroke="url(#gradBack)" stroke-width="12" />
     <path d="M 15 65 L 15 105 A 45 15 0 0 0 105 105 L 105 65" fill="none" stroke="url(#gradBack)" stroke-width="12" />
  </g>

  <text x="200" y="270" text-anchor="middle" class="text-main">FULLSTACK</text>
  <text x="200" y="315" text-anchor="middle" class="text-sub">COURSE</text>
</svg>
